name: Build NPC Hunter

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld python3

      - name: Build NRO
        run: |
          cd src
          bash build.sh

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: npc_hunter
          path: src/*.nro
